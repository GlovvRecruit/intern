<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>지원 완료</title>

<!--
  지원 완료 페이지가 새 사이트로 이전됐습니다(2026-08-28).

  **여기서는 CompleteRegistration 을 쏘지 않는다.** 새 /thankyou 가 직접 발화하므로
  여기서도 쏘면 같은 지원 1건이 두 번 전환으로 잡힌다. 이 페이지는 이동만 시킨다.

  쿼리스트링은 그대로 넘긴다 — Tally 가 붙여 보내는 값과 fbclid·utm_* 이 유실되면
  광고 귀속이 끊긴다.
-->

<script>
  (function () {
    var target = "https://beauty-recruit.vercel.app/thankyou";
    var qs = window.location.search || "";
    var hash = window.location.hash || "";
    window.location.replace(target + qs + hash);
  })();
</script>

<meta http-equiv="refresh" content="0; url=https://beauty-recruit.vercel.app/thankyou">
<link rel="canonical" href="https://beauty-recruit.vercel.app/thankyou">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f9fafb; color: #374151; }
  a { color: #ff0099; font-weight: 700; }
</style>
</head>
<body>
  <p>
    지원이 접수됐습니다.
    <a href="https://beauty-recruit.vercel.app/thankyou">확인 페이지로 이동</a>
  </p>
</body>
</html>
