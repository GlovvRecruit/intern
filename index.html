<!DOCTYPE html>

<title>글로브/플릭스 뷰티 전환형 인턴</title>

<!--
  이 페이지는 새 채용 사이트로 이전됐습니다(2026-08-28).

  왜 리다이렉트인가:
  - 옛 페이지와 새 사이트가 같은 Meta 픽셀(881944777433930)을 공유하면서 서로 다른 이벤트를
    쏘고 있었다. 특히 이 페이지는 CTA 클릭마다 Lead 를 발화해 하루 100건 넘는 정체불명의
    Lead 가 쌓였고, 전환 데이터가 두 도메인으로 갈라져 광고 최적화가 흐려졌다.
  - GitHub Pages 는 서버 301 을 지원하지 않으므로 meta refresh(0초) + JS 로 대체한다.
    검색엔진은 지연 0초의 meta refresh 를 301 과 동등하게 취급한다.

  주의: **쿼리스트링을 반드시 그대로 넘긴다.** fbclid·utm_* 이 유실되면 광고 귀속이 끊긴다
  (실제로 그 사고가 있었다). 그래서 정적 meta refresh 는 폴백으로만 두고, 스크립트가 먼저
  쿼리를 붙여 이동시킨다.

  이 페이지에서는 픽셀을 발화하지 않는다 — 새 페이지가 PageView 를 쏘므로 여기서 또 쏘면
  같은 방문이 두 번 집계된다.
-->

<script>
  (function () {
    var target = "https://beauty-recruit.vercel.app/careers/f4e83a80-c8dd-4d3a-b606-f7adc0873833";
    var qs = window.location.search || "";
    var hash = window.location.hash || "";
    window.location.replace(target + qs + hash);
  })();
</script>

<meta http-equiv="refresh" content="0; url=https://beauty-recruit.vercel.app/careers/f4e83a80-c8dd-4d3a-b606-f7adc0873833">

  a { color: #ff0099; font-weight: 700; }
</style>
</head>

  </p>
